# Template. Copy to .github/workflows/check.yml. It calls only the `check` recipe,
# so it holds no project logic. Keep the action versions pinned to full commits.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          summarize: false
      - name: Run every check
        run: nix develop --quiet --command just check
