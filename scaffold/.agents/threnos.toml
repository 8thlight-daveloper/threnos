# Which Threnos files this project takes. Run `nix run .#sync` after a change.
#
#   on       Sync installs the skill read-only and keeps it current.
#   off      Sync removes it, and the project has none.
#   ejected  Sync leaves the files alone. The project owns and edits them.
#
# A skill with no line here takes its default from Threnos, which is on for all.

[rules]
regenerative = "on"
# Repository context rules and the Repowise guide. Set to "off" to leave them out. Run sync after a change.
# repository_context = "off"

[skills]
# behavior-judge = "off"
# ux-designer = "off"
